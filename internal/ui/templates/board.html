{{define "board"}}
<div class="board">
  <ul class="tiles">
    {{range .}}<li class="tile {{.Status}}"><span class="tile-symbol">{{.Symbol}}</span>{{with .Score}}<span class="tile-score">{{.}}</span>{{end}}</li>
    {{end}}
  </ul>
</div>
{{end}}

{{define "legend"}}
<ul class="legend">
  {{range .}}<li><span class="swatch {{.Status}}"></span>{{.Label}}</li>
  {{end}}
</ul>
{{end}}
