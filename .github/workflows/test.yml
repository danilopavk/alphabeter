name: Test

# Railway's "Wait for CI" holds deploys of main until this workflow passes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alphabeter
          POSTGRES_PASSWORD: alphabeter
          POSTGRES_DB: alphabeter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphabeter -d alphabeter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      GOTOOLCHAIN: local
      TEST_DATABASE_URL: postgres://alphabeter:alphabeter@localhost:5432/alphabeter?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
