services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: alphabeter
      POSTGRES_PASSWORD: alphabeter
      POSTGRES_DB: alphabeter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphabeter -d alphabeter"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
